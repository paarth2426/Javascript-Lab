<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Billing Calculator</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #eef2f7;
            color: #111827;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: radial-gradient(circle at top, rgba(99,102,241,0.12), transparent 40%), #eef2f7;
        }

        .calculator {
            width: min(100%, 960px);
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
            padding: 32px;
            border: 1px solid rgba(148, 163, 184, 0.18);
        }

        .calculator-grid {
            display: grid;
            grid-template-columns: 1.1fr 0.95fr;
            gap: 32px;
            align-items: start;
        }

        .calculator-column {
            display: grid;
            gap: 18px;
        }

        h2 {
            margin: 0 0 24px;
            font-size: clamp(1.5rem, 2vw, 2rem);
            letter-spacing: -0.03em;
        }

        h3 {
            margin: 0 0 16px;
            font-size: 1.1rem;
            color: #374151;
        }

        p {
            margin: 0 0 18px;
            display: grid;
            gap: 10px;
            font-size: 0.98rem;
        }

        input {
            width: 100%;
            border-radius: 14px;
            border: 1px solid #d1d5db;
            padding: 14px 16px;
            font-size: 1rem;
            background: #f8fafc;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 5px rgba(99, 102, 241, 0.12);
            background: #ffffff;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 16px 18px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #4338ca, #6366f1);
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease;
            box-shadow: 0 16px 28px rgba(67, 56, 202, 0.18);
        }

        button:hover {
            transform: translateY(-1px);
            filter: brightness(1.05);
        }

        hr {
            border: none;
            height: 1px;
            background: #e5e7eb;
            margin: 28px 0;
        }

        .bill-panel {
            background: #f8fafc;
            border-radius: 22px;
            padding: 24px;
            border: 1px solid #e5e7eb;
        }

        #billOutput {
            min-height: 240px;
            padding: 20px;
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #e5e7eb;
            color: #111827;
            line-height: 1.35;
            white-space: pre-wrap;
            box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.05);
        }

        #billOutput p {
            margin: 0 0 10px;
        }

        #billOutput hr {
            margin: 10px 0;
        }

        @media (max-width: 1024px) {
            .calculator {
                width: min(100%, 760px);
            }
        }

        @media (max-width: 768px) {
            .calculator {
                width: min(100%, 620px);
            }

            .calculator-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 14px;
            }

            .calculator {
                padding: 24px;
            }
        }

        .student-badge {
            position: fixed;
            top: 16px;
            right: 16px;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 18px;
            box-shadow: 0 16px 35px rgba(15, 23, 42, 0.12);
            color: #0f172a;
            font-size: 0.92rem;
            line-height: 1.45;
            z-index: 999;
            text-align: right;
        }

        .student-badge strong {
            display: block;
            margin-bottom: 4px;
            font-weight: 700;
        }

        @media (max-width: 640px) {
            .student-badge {
                position: static;
                margin: 0 auto 24px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="student-badge">
        <strong>Paarth Maheshwari</strong>
        PRN: 24070521050<br>
        SEM: 5 A
    </div>

    <div class="calculator">
        <h2>Billing Calculator</h2>
        <div class="calculator-grid">
            <div class="calculator-column">
                <p>Customer Name: <input type="text" id="customerName"></p>
                <p>Product Name: <input type="text" id="productName"></p>
                <p>Quantity: <input type="number" id="productQty" min="1" value="1"></p>
                <p>Price per Unit: <input type="number" id="productPrice" min="0" step="0.01"></p>
                <button id="generateBtn">Generate Bill</button>
            </div>
            <div class="calculator-column">
                <div class="bill-panel">
                    <h3>Generated Bill</h3>
                    <div id="billOutput">
                        <!-- The text statement with calculations will appear here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- External JavaScript -->
    <script src="script.js"></script>
</body>
</html>
